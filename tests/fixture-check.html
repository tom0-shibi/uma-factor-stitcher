<!DOCTYPE html>
<html lang="ja">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>実画像fixture検証</title></head>
<body>
  <h1>開発用：実画像fixture検証</h1>
  <p>通常モジュールで8枚を解析します。Ground Truthは順序と枚数だけです。</p>
  <button id="run" type="button">Level 1〜3を検証</button>
  <p id="status" role="status"></p><pre id="report" style="white-space:pre-wrap"></pre><div id="preview"></div>
  <script type="module">
    import { runFixtureCheck } from './real-fixture-check.js';
    // Run on demand and show failures without hiding the observed report.
    document.querySelector('#run').addEventListener('click', async () => {
      const button = document.querySelector('#run');
      button.disabled = true;
      document.querySelector('#status').textContent = '解析中…';
      try {
        const { report, canvas } = await runFixtureCheck();
        document.querySelector('#report').textContent = JSON.stringify(report, null, 2);
        document.querySelector('#status').textContent = ['level1', 'level2', 'level3'].every((level) => report.levels[level]) ? 'Level 1〜3: PASS / Level 4: 目視確認待ち' : 'FAIL: 観測結果を確認してください。';
        canvas.style.maxWidth = '100%';
        document.querySelector('#preview').replaceChildren(canvas);
      } catch (error) {
        document.querySelector('#status').textContent = `FAIL: ${error.message}`;
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
